<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arquitectura · bus-tracking</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #fafafa;
      --color-ink:     #171717;
      --color-muted:   #525252;
      --color-accent:  #d7192d;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Arquitectura · bus-tracking</p>
    <h1>TransMilenio en vivo, del feed al mapa</h1>

    <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc">
      <title id="architecture-title">Arquitectura de bus-tracking</title>
      <desc id="architecture-desc">El API en Render consulta cada 30 segundos el feed GTFS Realtime de TransMilenio y entrega los buses troncales al navegador, que carga la web estática desde Cloudflare Pages y los mapas desde OpenFreeMap; una GitHub Action diaria regenera rutas y estaciones a partir de GTFS.zip y vuelve a desplegar el API y la web.</desc>
      <defs>
        <marker id="architecture-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#525252"/></marker>
        <marker id="architecture-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#d7192d"/></marker>
        <marker id="architecture-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2563eb"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#fafafa"/>

      <!-- Conectores (antes que los nodos) -->
      <!-- TransMilenio -> API: feed en vivo (fila superior, recta) -->
      <line x1="208" y1="232" x2="400" y2="232" fill="none" stroke="#2563eb" stroke-width="1.2" marker-end="url(#architecture-arrow-link)"/>
      <!-- TransMilenio -> GitHub Actions: GTFS.zip diario (sale por abajo, un codo r=8) -->
      <path d="M 124,264 V 424 Q 124,432 132,432 H 400" fill="none" stroke="#525252" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#architecture-arrow)"/>
      <!-- API -> Navegador: /vehicles -->
      <line x1="600" y1="232" x2="760" y2="232" fill="none" stroke="#2563eb" stroke-width="1.2" marker-end="url(#architecture-arrow-link)"/>
      <!-- OpenFreeMap -> Navegador: tiles -->
      <line x1="840" y1="112" x2="840" y2="200" fill="none" stroke="#525252" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>
      <!-- Cloudflare Pages -> Navegador: HTML + GeoJSON -->
      <line x1="840" y1="400" x2="840" y2="264" fill="none" stroke="#525252" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>
      <!-- GitHub Actions -> API y -> Pages: redeploy tras commit -->
      <line x1="500" y1="400" x2="500" y2="272" fill="none" stroke="#525252" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#architecture-arrow)"/>
      <line x1="600" y1="432" x2="760" y2="432" fill="none" stroke="#525252" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#architecture-arrow)"/>

      <!-- Etiquetas de conectores (máscara con 8px de separación) -->
        <rect x="260" y="212" width="84" height="12" rx="2" fill="#fafafa"/>
        <text x="302" y="221" fill="#2563eb" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GTFS-RT · 30 S</text>
        <rect x="240" y="412" width="52" height="12" rx="2" fill="#fafafa"/>
        <text x="266" y="421" fill="#525252" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GTFS.ZIP</text>
        <rect x="636" y="212" width="88" height="12" rx="2" fill="#fafafa"/>
        <text x="680" y="221" fill="#2563eb" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">/VEHICLES 15 S</text>
        <rect x="848" y="148" width="36" height="12" rx="2" fill="#fafafa"/>
        <text x="866" y="157" fill="#525252" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TILES</text>
        <rect x="748" y="324" width="84" height="12" rx="2" fill="#fafafa"/>
        <text x="790" y="333" fill="#525252" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HTML · GEOJSON</text>
        <rect x="508" y="328" width="52" height="12" rx="2" fill="#fafafa"/>
        <text x="534" y="337" fill="#525252" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REDEPLOY</text>
        <rect x="656" y="412" width="48" height="12" rx="2" fill="#fafafa"/>
        <text x="680" y="421" fill="#525252" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REBUILD</text>

      <!-- Nodos -->
        <rect x="40" y="200" width="168" height="64" rx="6" fill="#fafafa"/>
        <rect x="40" y="200" width="168" height="64" rx="6" fill="rgba(23,23,23,0.03)" stroke="rgba(23,23,23,0.30)" stroke-width="1"/>
        <rect x="48" y="208" width="28" height="12" rx="2" fill="transparent" stroke="rgba(23,23,23,0.22)" stroke-width="0.8"/>
        <text x="62" y="217" fill="#737373" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
        <text x="124" y="236" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">TransMilenio</text>
        <text x="124" y="252" fill="#525252" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">gtfs.transmilenio.gov.co</text>
        <rect x="400" y="192" width="200" height="80" rx="6" fill="#fafafa"/>
        <rect x="400" y="192" width="200" height="80" rx="6" fill="rgba(215,25,45,0.08)" stroke="#d7192d" stroke-width="1"/>
        <rect x="408" y="200" width="28" height="12" rx="2" fill="transparent" stroke="rgba(215,25,45,0.50)" stroke-width="0.8"/>
        <text x="422" y="209" fill="#d7192d" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
        <text x="500" y="228" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">API Fastify</text>
        <text x="500" y="244" fill="#525252" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Render · tras Cloudflare</text>
        <text x="500" y="258" fill="#525252" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">troncales · rumbo · caché</text>
        <rect x="400" y="400" width="200" height="64" rx="6" fill="#fafafa"/>
        <rect x="400" y="400" width="200" height="64" rx="6" fill="rgba(23,23,23,0.02)" stroke="rgba(23,23,23,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
        <rect x="408" y="408" width="32" height="12" rx="2" fill="transparent" stroke="rgba(23,23,23,0.22)" stroke-width="0.8"/>
        <text x="424" y="417" fill="#737373" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CRON</text>
        <text x="500" y="436" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">GitHub Actions</text>
        <text x="500" y="452" fill="#525252" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">diario 05:00 Bogotá</text>
        <rect x="760" y="48" width="160" height="64" rx="6" fill="#fafafa"/>
        <rect x="760" y="48" width="160" height="64" rx="6" fill="rgba(23,23,23,0.03)" stroke="rgba(23,23,23,0.30)" stroke-width="1"/>
        <rect x="768" y="56" width="28" height="12" rx="2" fill="transparent" stroke="rgba(23,23,23,0.22)" stroke-width="0.8"/>
        <text x="782" y="65" fill="#737373" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
        <text x="840" y="84" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">OpenFreeMap</text>
        <text x="840" y="100" fill="#525252" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">tiles vectoriales</text>
        <rect x="760" y="200" width="160" height="64" rx="6" fill="#fafafa"/>
        <rect x="760" y="200" width="160" height="64" rx="6" fill="rgba(82,82,82,0.10)" stroke="#737373" stroke-width="1"/>
        <rect x="768" y="208" width="32" height="12" rx="2" fill="transparent" stroke="rgba(82,82,82,0.40)" stroke-width="0.8"/>
        <text x="784" y="217" fill="#737373" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">USER</text>
        <text x="840" y="236" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Navegador</text>
        <text x="840" y="252" fill="#525252" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">mapcn + MapLibre</text>
        <rect x="760" y="400" width="160" height="64" rx="6" fill="#fafafa"/>
        <rect x="760" y="400" width="160" height="64" rx="6" fill="rgba(23,23,23,0.03)" stroke="rgba(23,23,23,0.30)" stroke-width="1"/>
        <rect x="768" y="408" width="28" height="12" rx="2" fill="transparent" stroke="rgba(23,23,23,0.22)" stroke-width="0.8"/>
        <text x="782" y="417" fill="#737373" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CDN</text>
        <text x="840" y="436" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cloudflare Pages</text>
        <text x="840" y="452" fill="#525252" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Next.js export estático</text>

      <!-- Leyenda -->
      <line x1="40" y1="524" x2="920" y2="524" stroke="rgba(23,23,23,0.10)" stroke-width="0.8"/>
      <text x="40" y="540" fill="#525252" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEYENDA</text>

      <rect x="40" y="552" width="16" height="12" rx="2" fill="rgba(215,25,45,0.08)" stroke="#d7192d" stroke-width="1"/>
      <text x="64" y="561" fill="#525252" font-size="8" font-family="'Geist', sans-serif">API (foco)</text>

      <rect x="140" y="552" width="16" height="12" rx="2" fill="rgba(23,23,23,0.03)" stroke="rgba(23,23,23,0.30)" stroke-width="1"/>
      <text x="164" y="561" fill="#525252" font-size="8" font-family="'Geist', sans-serif">Servicio externo</text>

      <rect x="264" y="552" width="16" height="12" rx="2" fill="rgba(23,23,23,0.02)" stroke="rgba(23,23,23,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="288" y="561" fill="#525252" font-size="8" font-family="'Geist', sans-serif">Tarea programada</text>

      <rect x="388" y="552" width="16" height="12" rx="2" fill="rgba(82,82,82,0.10)" stroke="#737373" stroke-width="1"/>
      <text x="412" y="561" fill="#525252" font-size="8" font-family="'Geist', sans-serif">Usuario</text>

      <line x1="480" y1="558" x2="508" y2="558" stroke="#2563eb" stroke-width="1.2" marker-end="url(#architecture-arrow-link)"/>
      <text x="516" y="561" fill="#525252" font-size="8" font-family="'Geist', sans-serif">Datos en vivo</text>

      <line x1="604" y1="558" x2="632" y2="558" stroke="#525252" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>
      <text x="640" y="561" fill="#525252" font-size="8" font-family="'Geist', sans-serif">Recursos estáticos</text>

      <line x1="752" y1="558" x2="780" y2="558" stroke="#525252" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#architecture-arrow)"/>
      <text x="788" y="561" fill="#525252" font-size="8" font-family="'Geist', sans-serif">Build / deploy diario</text>
    </svg>
  </div>
</body>
</html>
